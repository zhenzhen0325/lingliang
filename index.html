<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵粮补给站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --text: #111111;
            --card-bg: #000000;
            --card-text: #ffffff;
            --muted: #777777;
            --border: #e5e5e5;
            --radius: 24px;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 30px 80px rgba(0, 0, 0, 0.16);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* 背景装饰 */
        .bg-decoration {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-decoration::before,
        .bg-decoration::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.06;
            animation: float 12s ease-in-out infinite;
        }

        .bg-decoration::before {
            width: 500px;
            height: 500px;
            background: #000;
            top: -150px;
            right: -150px;
            animation-delay: 0s;
        }

        .bg-decoration::after {
            width: 400px;
            height: 400px;
            background: #000;
            bottom: -100px;
            left: -100px;
            animation-delay: -6s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, -20px) scale(1.05); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 24px;
            min-height: 100vh;
        }

        /* 页面切换动画 */
        .page {
            animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hidden {
            display: none !important;
        }

        /* 头部 */
        header {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 10px;
            position: relative;
            display: inline-block;
        }

        .logo::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: var(--text);
            border-radius: 2px;
            animation: lineGrow 1s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
            transform-origin: center;
            opacity: 0;
        }

        @keyframes lineGrow {
            from { width: 0; opacity: 0; }
            to { width: 60px; opacity: 1; }
        }

        .subtitle {
            color: var(--muted);
            font-size: 1.05rem;
            letter-spacing: 2px;
            animation: fadeIn 1s ease 0.5s backwards;
        }

        /* 首页卡片网格 */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .category-card {
            background: var(--card-bg);
            color: var(--card-text);
            border-radius: 20px;
            padding: 28px 24px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            border: 2px solid transparent;
            transform-style: preserve-3d;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .category-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.12) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .category-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: var(--shadow-hover);
            border-color: rgba(255,255,255,0.3);
        }

        .category-card:hover::before {
            opacity: 1;
        }

        .category-card:active {
            transform: translateY(-4px) scale(0.98);
        }

        @media (hover: none) {
            .category-card:hover {
                transform: none;
                box-shadow: var(--shadow);
                border-color: transparent;
            }
            .category-card:hover::before {
                opacity: 0;
            }
            .category-card:active {
                transform: scale(0.97);
                background: #1a1a1a;
            }
        }

        .card-title {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .card-count {
            font-size: 0.85rem;
            opacity: 0.7;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-count .number {
            font-size: 1.1rem;
            font-weight: 700;
            opacity: 1;
        }

        .card-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.8rem;
            opacity: 0.08;
            z-index: 0;
            transition: all 0.4s;
        }

        .category-card:hover .card-icon {
            opacity: 0.15;
            transform: translateY(-50%) scale(1.1) rotate(5deg);
        }

        /* 详情页 */
        .detail-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 48px;
        }

        .back-btn {
            width: 48px;
            height: 48px;
            border: 2px solid var(--text);
            background: transparent;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            flex-shrink: 0;
        }

        .back-btn:hover {
            background: var(--text);
            color: var(--bg);
            transform: translateX(-4px);
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
        }

        .detail-title-group h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .detail-count {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .detail-count span {
            color: var(--text);
            font-weight: 700;
        }

        /* 操作区 */
        .action-area {
            background: #fafafa;
            border-radius: var(--radius);
            padding: 40px;
            margin-bottom: 32px;
            border: 1px solid var(--border);
        }

        .input-section {
            margin-bottom: 24px;
        }

        .input-label {
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 12px;
            display: block;
            letter-spacing: 1px;
        }

        .verse-input {
            width: 100%;
            min-height: 140px;
            padding: 20px;
            border: 2px solid var(--border);
            border-radius: 16px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            background: var(--bg);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            outline: none;
            -webkit-appearance: none;
        }

        .verse-input:focus {
            border-color: var(--text);
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.06);
        }

        .verse-input::placeholder {
            color: #bbb;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .btn {
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid var(--text);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255,255,255,0.3) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: var(--text);
            color: var(--bg);
        }

        .btn-primary:hover {
            background: #333;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text);
        }

        .btn-secondary:hover {
            background: var(--text);
            color: var(--bg);
            transform: translateY(-2px);
        }

        /* 结果显示 */
        .result-section {
            background: var(--card-bg);
            color: var(--card-text);
            border-radius: var(--radius);
            padding: 48px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .result-section.show {
            opacity: 1;
            transform: translateY(0);
        }

        .result-label {
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.6;
            margin-bottom: 20px;
        }

        .result-text {
            font-size: 1.35rem;
            line-height: 1.8;
            font-weight: 400;
            position: relative;
            z-index: 1;
        }

        .result-empty {
            text-align: center;
            opacity: 0.6;
            font-size: 1.1rem;
        }

        .result-decoration {
            position: absolute;
            right: 30px;
            bottom: 20px;
            font-size: 6rem;
            opacity: 0.05;
            line-height: 1;
        }

        /* 提示消息 */
        .toast {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--text);
            color: var(--bg);
            padding: 16px 32px;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: var(--shadow-hover);
            z-index: 1000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast-icon {
            width: 20px;
            height: 20px;
            border: 2px solid currentColor;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        /* 确认对话框 */
        .confirm-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            padding: 20px;
        }

        .confirm-modal.show {
            opacity: 1;
            visibility: visible;
        }

        .confirm-box {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 36px;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow-hover);
            transform: scale(0.9) translateY(20px);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .confirm-modal.show .confirm-box {
            transform: scale(1) translateY(0);
        }

        .confirm-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .confirm-message {
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .confirm-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .confirm-actions .btn {
            padding: 12px 24px;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        /* 经文列表 */
        .verse-list {
            margin-top: 32px;
        }

        .verse-list-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .verse-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            transition: all 0.3s;
            animation: slideIn 0.4s ease backwards;
        }

        .verse-item:hover {
            border-color: var(--text);
            transform: translateX(4px);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .verse-item-text {
            flex: 1;
            line-height: 1.7;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .delete-btn:hover {
            background: rgba(0,0,0,0.05);
            color: #000;
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .container {
                padding: 24px 16px;
            }

            header {
                margin-bottom: 24px;
            }

            .logo {
                font-size: 1.6rem;
                letter-spacing: 2px;
            }

            .subtitle {
                font-size: 0.85rem;
                letter-spacing: 1px;
            }

            .category-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .category-card {
                padding: 18px 18px;
                border-radius: 16px;
            }

            .card-title {
                font-size: 1.15rem;
                margin-bottom: 4px;
            }

            .card-count {
                font-size: 0.8rem;
            }

            .card-count .number {
                font-size: 1rem;
            }

            .card-icon {
                font-size: 1.4rem;
                right: 14px;
            }

            .detail-header {
                margin-bottom: 32px;
                gap: 14px;
            }

            .detail-title-group h2 {
                font-size: 1.6rem;
            }

            .back-btn {
                width: 42px;
                height: 42px;
            }

            .action-area {
                padding: 22px;
                border-radius: 20px;
            }

            .verse-input {
                min-height: 120px;
                padding: 16px;
            }

            .btn {
                width: 100%;
                justify-content: center;
                padding: 15px 20px;
                font-size: 1rem;
            }

            .button-group {
                flex-direction: column;
                gap: 12px;
            }

            .result-section {
                padding: 28px 22px;
                border-radius: 20px;
                min-height: 160px;
            }

            .result-text {
                font-size: 1.1rem;
                line-height: 1.75;
            }

            .result-decoration {
                font-size: 4rem;
            }

            .toast {
                top: 24px;
                padding: 14px 24px;
                max-width: calc(100vw - 32px);
                font-size: 0.95rem;
            }

            .verse-item {
                padding: 16px;
            }

            .confirm-box {
                padding: 28px 24px;
                border-radius: 20px;
            }

            .confirm-actions {
                flex-direction: column;
            }

            .confirm-actions .btn {
                width: 100%;
                justify-content: center;
            }
        }

    </style>
</head>
<body>
    <div class="bg-decoration"></div>

    <div class="toast" id="toast">
        <span class="toast-icon">✓</span>
        <span id="toastText">储存成功</span>
    </div>

    <!-- 确认对话框 -->
    <div class="confirm-modal" id="confirmModal">
        <div class="confirm-box">
            <div class="confirm-title">提示</div>
            <div class="confirm-message" id="confirmMessage">确定要执行此操作吗？</div>
            <div class="confirm-actions">
                <button class="btn btn-secondary" id="confirmCancel">取消</button>
                <button class="btn btn-primary" id="confirmOk">确定</button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 首页 -->
        <div id="homePage" class="page">
            <header>
                <h1 class="logo">灵粮补给站</h1>
                <p class="subtitle">在需要时，领受一句属于你的心声</p>
            </header>

            <div class="category-grid" id="categoryGrid">
                <!-- 卡片由 JS 生成 -->
            </div>
        </div>

        <!-- 详情页 -->
        <div id="detailPage" class="page hidden">
            <div class="detail-header">
                <button class="back-btn" id="backBtn" aria-label="返回">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <div class="detail-title-group">
                    <h2 id="detailTitle">分类名称</h2>
                    <p class="detail-count">已储存经文：<span id="detailCount">0</span> 条</p>
                </div>
            </div>

            <div class="action-area">
                <div class="input-section">
                    <label class="input-label">经文内容</label>
                    <textarea 
                        class="verse-input" 
                        id="verseInput" 
                        placeholder="在此粘贴或输入经文，可以是整节经文或你心中的感动..."
                    ></textarea>
                </div>

                <div class="button-group">
                    <button class="btn btn-secondary" id="pasteBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                        </svg>
                        粘贴
                    </button>
                    <button class="btn btn-primary" id="saveBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                            <polyline points="17 21 17 13 7 13 7 21"></polyline>
                            <polyline points="7 3 7 8 15 8"></polyline>
                        </svg>
                        确认储存
                    </button>
                    <button class="btn btn-primary" id="drawBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                        </svg>
                        灵粮获取
                    </button>
                    <button class="btn btn-secondary" id="exportBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        导出经文
                    </button>
                </div>
            </div>

            <div class="result-section" id="resultSection">
                <div class="result-label">今日灵粮</div>
                <div class="result-text" id="resultText">
                    <div class="result-empty">点击下方「灵粮获取」，让话语成为你的力量</div>
                </div>
                <div class="result-decoration">✦</div>
            </div>

            <div class="verse-list" id="verseListSection">
                <div class="verse-list-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                    已储存经文
                </div>
                <div id="verseList"></div>
            </div>
        </div>
    </div>

    <script>
        // 配置
        const STORAGE_KEY = 'spiritual_bread_data_v1';
        
        const categories = [
            { id: 'burden', name: '重担压身', icon: '⛰️', default: '凡劳苦担重担的人，可以到我这里来，我就使你们得安息。' },
            { id: 'fear', name: '不安惧怕', icon: '💨', default: '不要惧怕，因为我与你同在；不要惊惶，因为我是你的神。' },
            { id: 'confused', name: '迷茫疑惑', icon: '🌫️', default: '你要专心仰赖耶和华，不可倚靠自己的聪明，在你一切所行的事上都要认定他，他必指引你的路。' },
            { id: 'growth', name: '灵性成长', icon: '🌱', default: '惟喜爱耶和华的律法，昼夜思想，这人便为有福。' },
            { id: 'grief', name: '忧伤哀恸', icon: '💧', default: '哀恸的人有福了，因为他们必得安慰。' },
            { id: 'social', name: '社交压力', icon: '🤝', default: '你们各人不要单顾自己的事，也要顾别人的事。' }
        ];

        // 圣经书卷名（按长度降序，优先匹配全称）
        const bookNames = [
            '马太福音','马可福音','路加福音','约翰福音','使徒行传',
            '罗马书','哥林多前书','哥林多后书','加拉太书','以弗所书',
            '腓立比书','歌罗西书','帖撒罗尼迦前书','帖撒罗尼迦后书',
            '提摩太前书','提摩太后书','提多书','腓利门书','希伯来书',
            '雅各书','彼得前书','彼得后书','约翰一书','约翰二书',
            '约翰三书','犹大书','启示录',
            '创世记','出埃及记','利未记','民数记','申命记',
            '约书亚记','士师记','路得记','撒母耳记上','撒母耳记下',
            '列王纪上','列王纪下','历代志上','历代志下','以斯拉记',
            '尼希米记','以斯帖记','约伯记','诗篇','箴言',
            '传道书','雅歌','以赛亚书','耶利米书','耶利米哀歌',
            '以西结书','但以理书','何西阿书','约珥书','阿摩司书',
            '俄巴底亚书','约拿书','弥迦书','那鸿书','哈巴谷书',
            '西番雅书','哈该书','撒迦利亚书','玛拉基书',
            '太','可','路','约','徒','罗','林前','林后','加','弗',
            '腓','西','帖前','帖后','提前','提后','多','门','来',
            '雅','彼前','彼后','约一','约二','约三','犹','启',
            '创','出','利','民','申','书','士','得','撒上','撒下',
            '王上','王下','代上','代下','拉','尼','斯','伯','诗',
            '箴','传','歌','赛','耶','哀','结','但','何','珥','摩',
            '俄','拿','弥','鸿','哈','番','该','亚','玛'
        ];

        // 提取经文出处（如：马太福音1:1、马太福音1:1-2）
        function extractReference(text) {
            const escapedBooks = bookNames.map(name => name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
            const bookPattern = escapedBooks.join('|');
            // 匹配：书卷名 章:节 [-结束节或结束章:节]，允许书卷名和数字之间有空格
            const regex = new RegExp(`(${bookPattern})\\s*(\\d+):(\\d+)(?:\\s*[-–~]\\s*(\\d+)(?::(\\d+))?)?`, 'g');
            
            let match;
            let lastMatch = null;
            while ((match = regex.exec(text)) !== null) {
                lastMatch = match;
            }
            
            if (!lastMatch) return null;
            
            const [, book, chapter, verse, endChapterOrVerse, endVerse] = lastMatch;
            let normalized = `${book}${chapter}:${verse}`;
            if (endChapterOrVerse) {
                if (endVerse) {
                    normalized += `-${endChapterOrVerse}:${endVerse}`;
                } else {
                    normalized += `-${endChapterOrVerse}`;
                }
            }
            return normalized.replace(/\s+/g, '');
        }

        // 状态
        let currentCategory = null;
        let isTyping = false;

        // DOM 元素
        const homePage = document.getElementById('homePage');
        const detailPage = document.getElementById('detailPage');
        const categoryGrid = document.getElementById('categoryGrid');
        const backBtn = document.getElementById('backBtn');
        const detailTitle = document.getElementById('detailTitle');
        const detailCount = document.getElementById('detailCount');
        const verseInput = document.getElementById('verseInput');
        const pasteBtn = document.getElementById('pasteBtn');
        const saveBtn = document.getElementById('saveBtn');
        const drawBtn = document.getElementById('drawBtn');
        const exportBtn = document.getElementById('exportBtn');
        const resultSection = document.getElementById('resultSection');
        const resultText = document.getElementById('resultText');
        const verseList = document.getElementById('verseList');
        const verseListSection = document.getElementById('verseListSection');
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toastText');
        const confirmModal = document.getElementById('confirmModal');
        const confirmMessage = document.getElementById('confirmMessage');
        const confirmOk = document.getElementById('confirmOk');
        const confirmCancel = document.getElementById('confirmCancel');

        // 初始化数据
        function getData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    return JSON.parse(raw);
                }
            } catch (e) {
                console.error('读取数据失败', e);
            }
            const data = {};
            categories.forEach(cat => {
                data[cat.id] = [];
            });
            return data;
        }

        function saveData(data) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                console.error('保存数据失败', e);
            }
        }

        function getCategoryVerses(categoryId) {
            const data = getData();
            return data[categoryId] || [];
        }

        function addVerse(categoryId, text) {
            const data = getData();
            if (!data[categoryId]) data[categoryId] = [];
            data[categoryId].unshift({
                id: Date.now(),
                text: text.trim(),
                createdAt: new Date().toISOString()
            });
            saveData(data);
        }

        function deleteVerse(categoryId, verseId) {
            const data = getData();
            if (data[categoryId]) {
                data[categoryId] = data[categoryId].filter(v => v.id !== verseId);
                saveData(data);
            }
        }

        // 渲染首页
        function renderHome() {
            categoryGrid.innerHTML = '';
            const data = getData();
            
            categories.forEach((cat, index) => {
                const count = (data[cat.id] || []).length;
                const card = document.createElement('div');
                card.className = 'category-card';
                card.style.animationDelay = `${index * 0.08}s`;
                card.innerHTML = `
                    <div class="card-icon">${cat.icon}</div>
                    <div class="card-title">${cat.name}</div>
                    <div class="card-count">已储存 <span class="number">${count}</span> 条经文</div>
                `;
                
                // 鼠标跟随光效
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = ((e.clientX - rect.left) / rect.width) * 100;
                    const y = ((e.clientY - rect.top) / rect.height) * 100;
                    card.style.setProperty('--x', `${x}%`);
                    card.style.setProperty('--y', `${y}%`);
                });

                card.addEventListener('click', () => openCategory(cat));
                categoryGrid.appendChild(card);
            });
        }

        // 打开分类详情
        function openCategory(category) {
            currentCategory = category;
            isTyping = false;
            detailTitle.textContent = category.name;
            updateDetailCount();
            verseInput.value = '';
            resultSection.classList.remove('show');
            resultText.innerHTML = '<div class="result-empty">点击下方「灵粮获取」，让话语成为你的力量</div>';
            renderVerseList();

            homePage.classList.add('hidden');
            detailPage.classList.remove('hidden');
            detailPage.style.animation = 'none';
            detailPage.offsetHeight; // 触发重排
            detailPage.style.animation = '';
        }

        // 返回首页
        function backToHome() {
            detailPage.classList.add('hidden');
            homePage.classList.remove('hidden');
            homePage.style.animation = 'none';
            homePage.offsetHeight;
            homePage.style.animation = '';
            renderHome();
        }

        // 更新数量显示
        function updateDetailCount() {
            const count = getCategoryVerses(currentCategory.id).length;
            detailCount.textContent = count;
        }

        // 渲染经文列表
        function renderVerseList() {
            const verses = getCategoryVerses(currentCategory.id);
            verseList.innerHTML = '';
            
            if (verses.length === 0) {
                verseListSection.style.display = 'none';
                return;
            }
            
            verseListSection.style.display = 'block';
            verses.forEach((verse, index) => {
                const item = document.createElement('div');
                item.className = 'verse-item';
                item.style.animationDelay = `${index * 0.05}s`;
                item.innerHTML = `
                    <div class="verse-item-text">${escapeHtml(verse.text)}</div>
                    <button class="delete-btn" data-id="${verse.id}" title="删除">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                `;
                verseList.appendChild(item);
            });

            // 绑定删除事件
            verseList.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.dataset.id);
                    deleteVerse(currentCategory.id, id);
                    renderVerseList();
                    updateDetailCount();
                    showToast('已删除');
                });
            });
        }

        // 粘贴按钮
        async function handlePaste() {
            try {
                const text = await navigator.clipboard.readText();
                verseInput.value = text;
                verseInput.focus();
                showToast('已粘贴');
            } catch (err) {
                verseInput.focus();
                showToast('请手动粘贴（浏览器权限限制）');
            }
        }

        // 保存按钮
        async function handleSave() {
            const text = verseInput.value.trim();
            if (!text) {
                showToast('请先输入或粘贴经文');
                verseInput.focus();
                return;
            }

            const verses = getCategoryVerses(currentCategory.id);
            const inputRef = extractReference(text);
            const isDuplicate = verses.some(v => {
                const existingRef = extractReference(v.text);
                // 若经文出处都能识别，按出处判断重复
                if (inputRef && existingRef) {
                    return inputRef === existingRef;
                }
                // 否则按完整文本判断
                return v.text.trim() === text;
            });
            if (isDuplicate) {
                const confirmed = await showConfirm('该类别下已存在相同出处的经文，确定还要存入吗？');
                if (!confirmed) {
                    return;
                }
            }

            addVerse(currentCategory.id, text);
            verseInput.value = '';
            updateDetailCount();
            renderVerseList();
            showToast('储存成功');
        }

        // 灵粮获取
        function handleDraw() {
            const verses = getCategoryVerses(currentCategory.id);
            let selectedText;
            
            if (verses.length === 0) {
                selectedText = currentCategory.default;
                showToast('暂无储存，先为你预备一句话');
            } else {
                const randomIndex = Math.floor(Math.random() * verses.length);
                selectedText = verses[randomIndex].text;
            }

            resultSection.classList.remove('show');
            setTimeout(() => {
                resultSection.classList.add('show');
                typeWriter(resultText, selectedText, 20);
            }, 100);
        }

        // 打字机效果（支持多行自动换行）
        function typeWriter(element, text, speed = 20) {
            if (isTyping) return;
            isTyping = true;
            element.textContent = '';
            let i = 0;
            function type() {
                if (i < text.length) {
                    element.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else {
                    isTyping = false;
                }
            }
            type();
        }

        // 导出该分类全部经文
        function handleExport() {
            const verses = getCategoryVerses(currentCategory.id);
            if (verses.length === 0) {
                showToast('当前分类没有可导出的经文');
                return;
            }

            const now = new Date();
            const dateStr = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });

            let content = `灵粮补给站 — ${currentCategory.name}\n`;
            content += `导出时间：${dateStr}\n`;
            content += `共 ${verses.length} 条经文\n`;
            content += `${'='.repeat(40)}\n\n`;

            verses.forEach((verse, index) => {
                content += `[${index + 1}]\n${verse.text}\n\n`;
            });

            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `灵粮补给站_${currentCategory.name}_${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}.txt`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            showToast(`已导出 ${verses.length} 条经文`);
        }

        // 自定义确认对话框
        function showConfirm(message) {
            return new Promise((resolve) => {
                confirmMessage.textContent = message;
                confirmModal.classList.add('show');

                const onOk = () => {
                    cleanup();
                    resolve(true);
                };

                const onCancel = () => {
                    cleanup();
                    resolve(false);
                };

                const onBackdrop = (e) => {
                    if (e.target === confirmModal) {
                        cleanup();
                        resolve(false);
                    }
                };

                const onKeydown = (e) => {
                    if (e.key === 'Escape') {
                        cleanup();
                        resolve(false);
                    }
                };

                function cleanup() {
                    confirmModal.classList.remove('show');
                    confirmOk.removeEventListener('click', onOk);
                    confirmCancel.removeEventListener('click', onCancel);
                    confirmModal.removeEventListener('click', onBackdrop);
                    document.removeEventListener('keydown', onKeydown);
                }

                confirmOk.addEventListener('click', onOk);
                confirmCancel.addEventListener('click', onCancel);
                confirmModal.addEventListener('click', onBackdrop);
                document.addEventListener('keydown', onKeydown);
            });
        }

        // 提示消息
        let toastTimeout;
        function showToast(message) {
            toastText.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 事件绑定
        backBtn.addEventListener('click', backToHome);
        pasteBtn.addEventListener('click', handlePaste);
        saveBtn.addEventListener('click', handleSave);
        drawBtn.addEventListener('click', handleDraw);
        exportBtn.addEventListener('click', handleExport);

        verseInput.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                handleSave();
            }
        });

        // 初始化
        renderHome();
    </script>
</body>
</html>
